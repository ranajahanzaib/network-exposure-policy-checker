services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo-only-change-me
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  api:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
  admin:
    image: nginx:alpine
    ports:
      - "127.0.0.1:4000:80"
