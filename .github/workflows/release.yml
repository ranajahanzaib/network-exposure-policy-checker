name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: |
          cp target/${{ matrix.target }}/release/network-exposure-policy-checker network-exposure-policy-checker-${{ matrix.target }}
          shasum -a 256 network-exposure-policy-checker-${{ matrix.target }} > network-exposure-policy-checker-${{ matrix.target }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            network-exposure-policy-checker-${{ matrix.target }}
            network-exposure-policy-checker-${{ matrix.target }}.sha256
