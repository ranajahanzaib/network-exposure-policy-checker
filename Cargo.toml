[package]
name = "network-exposure-policy-checker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Compare declared network access with Docker configuration and TCP probe evidence"
readme = "README.md"
repository = "https://github.com/ranajahanzaib/network-exposure-policy-checker"
homepage = "https://github.com/ranajahanzaib/network-exposure-policy-checker"
documentation = "https://github.com/ranajahanzaib/network-exposure-policy-checker#readme"
keywords = ["network", "security", "docker", "cli"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["PLAN.md"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["full"] }
sha2 = "0.10.9"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
